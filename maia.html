<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAIA check — Ahn Research Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261022a">
<style>
.head{position:absolute;left:56px;top:68px;width:1168px}
.head .ck{color:var(--brass);font-size:12px}
.left{position:absolute;left:56px;top:186px;width:660px;height:466px;display:flex;flex-direction:column}
.right{position:absolute;left:732px;top:186px;width:492px;height:466px;display:flex;flex-direction:column;background:var(--panel);border-color:rgba(185,163,122,.35)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.presets button{border:1px solid var(--line);background:transparent;border-radius:2px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#cbd5e1;cursor:pointer}
.presets button:hover,.presets button.on{border-color:#b9a37a;color:#ece8e1;background:rgba(185,163,122,.12)}
.sl{display:grid;grid-template-columns:200px 1fr 40px;align-items:center;gap:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.sl label{font-size:13.5px;font-weight:600;line-height:1.2}
.sl label small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:2px}
.sl output{font-family:var(--mono);font-weight:500;text-align:right;font-size:14px;color:#ece8e1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,#b9a37a var(--p,50%),rgba(236,232,225,.12) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(185,163,122,.4);cursor:pointer}
.gq{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.gq small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;background:transparent;font-size:12px;font-weight:800;padding:6px 11px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#ece8e1;color:#0f1318}
.seg button.on[data-v=yes]{background:#b77a6f;color:#160b09}
.seg button.on[data-v=u]{background:#94a3b8;color:#0b1220}
.vk{font-size:11px;font-weight:600;letter-spacing:2.4px;color:var(--brass)}
.verdict{font-family:var(--head);font-size:42px;font-weight:600;letter-spacing:-.6px;margin-top:6px;line-height:1.05;transition:color .3s}
.why{font-size:14px;line-height:1.55;color:#cbd5e1;margin-top:10px;min-height:44px}
.rgrid{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;margin-top:8px}
#radar{width:200px;height:200px}
.meta{font-family:var(--mono);font-size:13px;color:#cbd5e1;line-height:1.9}
.meta b{color:#fff}
.flag{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:#c9a96e;border:1px solid rgba(201,169,110,.5);border-radius:2px;padding:2px 9px;opacity:0;transition:opacity .3s}
.flag.on{opacity:1}
.scale{position:relative;height:6px;border-radius:0;margin-top:auto;background:linear-gradient(90deg,#b77a6f 0 50%,#c9a96e 50% 75%,#7fa3c7 75% 100%)}
.scale i{position:absolute;top:-8px;width:2px;height:22px;background:#ece8e1;transform:translateX(-1px);transition:left .4s cubic-bezier(.2,.8,.2,1)}
.scale-l{position:relative;height:16px;font-size:11.5px;color:#94a3b8;margin-top:8px}
.scale-l span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scale-l span:first-child{transform:none}.scale-l span:last-child{transform:translateX(-100%)}
.warn{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:12px}
</style>
</head>
<body data-page="maia">
<div class="stage" id="stage"><div class="page" id="page">

  <div class="head">
    <div class="ck" data-ko="MAIA 진단 · 직접 해 보기" data-en="MAIA CHECK · TRY IT"></div>
    <div class="h2" data-ko="MAIA <em>작업 배분</em> 진단" data-en="MAIA <em>task allocation</em> check"></div>
    <p class="lead" data-ko="역량 점수 5개(C1·C2·C3·C4·C6)의 평균으로 작업을 AI·협업·사람에 배분합니다. 관문 3개 중 하나라도 해당하면 점수와 관계없이 사람이 맡습니다." data-en="Five capability scores are averaged to assign a task to AI, AI with a person, or a person; any one of three gates sends it to a person."></p>
  </div>

  <div class="card left">
    <div class="ck" data-ko="예시 작업 불러오기" data-en="LOAD AN EXAMPLE TASK"></div>
    <div class="presets" id="presets"></div>
    <div style="height:2px"></div>
    <div class="sl"><label data-ko="C1 데이터<small>공개 사례·참고 구현이 있나</small>" data-en="C1 Data<small>public examples exist?</small>"></label><input type="range" min="0" max="10" value="5" data-c="0"><output>0.5</output></div>
    <div class="sl"><label data-ko="C2 방법 성숙도<small>검증된 방법이 있나</small>" data-en="C2 Method maturity<small>validated methods?</small>"></label><input type="range" min="0" max="10" value="5" data-c="1"><output>0.5</output></div>
    <div class="sl"><label data-ko="C3 구조화<small>명세로 쓸 수 있나</small>" data-en="C3 Structure<small>can it be written as a spec?</small>"></label><input type="range" min="0" max="10" value="5" data-c="2"><output>0.5</output></div>
    <div class="sl"><label data-ko="C4 검증 가능성<small>기계가 확인할 수 있나</small>" data-en="C4 Verifiability<small>can a machine check it?</small>"></label><input type="range" min="0" max="10" value="5" data-c="3"><output>0.5</output></div>
    <div class="sl"><label data-ko="C6 전문지식 독립성<small>암묵지가 적은가</small>" data-en="C6 Expertise independence<small>little tacit know-how?</small>"></label><input type="range" min="0" max="10" value="5" data-c="4"><output>0.5</output></div>
    <div class="gq"><span data-ko="현장에서 손으로 해야 하나?<small>관문 1 · 현장 물리 작업</small>" data-en="Needs hands-on work on site?<small>Gate 1 · physical</small>"></span><div class="seg" data-g="0"><button data-v="no" class="on" data-ko="아니오" data-en="No"></button><button data-v="yes" data-ko="예" data-en="Yes"></button><button data-v="u" data-ko="모름" data-en="Unsure"></button></div></div>
    <div class="gq"><span data-ko="AI가 못 쓰는 도구가 꼭 필요한가?<small>관문 2 · 도구 접근</small>" data-en="Needs a tool AI cannot reach?<small>Gate 2 · toolchain</small>"></span><div class="seg" data-g="1"><button data-v="no" class="on" data-ko="아니오" data-en="No"></button><button data-v="yes" data-ko="예" data-en="Yes"></button><button data-v="u" data-ko="모름" data-en="Unsure"></button></div></div>
    <div class="gq" style="border-bottom:0"><span data-ko="최종 안전·법적 판단을 내리나?<small>관문 3 · 안전·법적 최종성</small>" data-en="Makes a final safety or legal decision?<small>Gate 3 · safety-legal</small>"></span><div class="seg" data-g="2"><button data-v="no" class="on" data-ko="아니오" data-en="No"></button><button data-v="yes" data-ko="예" data-en="Yes"></button><button data-v="u" data-ko="모름" data-en="Unsure"></button></div></div>
  </div>

  <div class="card right">
    <div class="vk" data-ko="제안 배분" data-en="PROPOSED ALLOCATION"></div>
    <div class="verdict" id="verdict"></div>
    <div class="why" id="why"></div>
    <div class="rgrid">
      <svg id="radar" viewBox="0 0 200 200"></svg>
      <div class="meta" id="meta"></div>
    </div>
    <div class="scale"><i id="marker"></i></div>
    <div class="scale-l"><span style="left:0" data-ko="사람" data-en="Person"></span><span style="left:50%">0.50</span><span style="left:62.5%" data-ko="협업" data-en="Together"></span><span style="left:75%">0.75</span><span style="left:100%">AI</span></div>
    <div class="warn" data-ko="MAIA v1.1 운영판 초안의 시연입니다. 결과는 계획 제안이며 실행 권한이 아닙니다. 입력은 이 브라우저 밖으로 나가지 않습니다." data-en="Demo of the MAIA v1.1 operational draft. The result is a planning proposal, not execution authority. Inputs never leave this browser."></div>
  </div>

  <div class="foot"><a href="index.html" data-ko="← 처음으로" data-en="← Home"></a><span>Esc</span><span class="r" data-ko="정의: MAIA v1.1 운영판 사양(초안)" data-en="Definition: MAIA v1.1 operational specification (draft)"></span></div>

</div></div>
<script src="assets/i18n.js?v=20261022a"></script>
<script src="assets/site.js?v=20261022a"></script>
<script>
(function(){
const L=window.LAB,NS='http://www.w3.org/2000/svg';
// same illustrative tasks as the home animation
const PRESETS=[
  {ko:'외관 검사 판정',en:'Visual inspection call',c:[.8,.8,.7,.8,.8],g:['no','no','no']},
  {ko:'PLC 로그 대조',en:'PLC log conformance',c:[.9,.8,.9,.9,.7],g:['no','no','no']},
  {ko:'15분 전력 계획',en:'15-min power plan',c:[.6,.7,.8,.6,.5],g:['no','no','no']},
  {ko:'불량 원인 분석',en:'Defect root cause',c:[.5,.6,.6,.5,.5],g:['no','no','no']},
  {ko:'센서 결선',en:'Sensor wiring',c:[.6,.7,.6,.4,.6],g:['yes','no','no']},
  {ko:'안전 정지 최종 승인',en:'Safety-stop sign-off',c:[.5,.5,.6,.5,.4],g:['no','no','yes']}
];
const gates=['no','no','no'];
const inputs=[...document.querySelectorAll('input[type=range]')];
const pr=document.getElementById('presets');
function drawPresets(){pr.innerHTML='';PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=L.T(p.ko,p.en);b.onclick=()=>load(i,b);pr.appendChild(b)})}
function load(i,btn){const p=PRESETS[i];inputs.forEach((x,k)=>x.value=Math.round(p.c[k]*10));p.g.forEach((v,k)=>setGate(k,v));pr.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));update()}
function setGate(k,v){gates[k]=v;document.querySelectorAll('.seg[data-g="'+k+'"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setGate(+s.dataset.g,b.dataset.v);pr.querySelectorAll('button').forEach(x=>x.classList.remove('on'));update()}));
inputs.forEach(x=>x.addEventListener('input',()=>{pr.querySelectorAll('button').forEach(b=>b.classList.remove('on'));update()}));

// radar
const R=document.getElementById('radar'),cx=100,cy=100,RR=72,AX=['C1','C2','C3','C4','C6'];
function pt(i,r){const a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
for(let k=1;k<=4;k++){const p=document.createElementNS(NS,'polygon');p.setAttribute('points',[0,1,2,3,4].map(i=>pt(i,RR*k/4).join(',')).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','rgba(255,255,255,'+(k===4?.25:.1)+')');R.appendChild(p)}
const thr=document.createElementNS(NS,'polygon');thr.setAttribute('points',[0,1,2,3,4].map(i=>pt(i,RR*.75).join(',')).join(' '));thr.setAttribute('fill','none');thr.setAttribute('stroke','rgba(127,163,199,.55)');thr.setAttribute('stroke-dasharray','3 4');R.appendChild(thr);
const poly=document.createElementNS(NS,'polygon');poly.setAttribute('fill','rgba(185,163,122,.22)');poly.setAttribute('stroke','#b9a37a');poly.setAttribute('stroke-width','1.4');R.appendChild(poly);
AX.forEach((s,i)=>{const [x,y]=pt(i,RR+14);const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.setAttribute('font-weight','600');t.setAttribute('fill','#b9a37a');t.textContent=s;R.appendChild(t)});
let cur=[.5,.5,.5,.5,.5],target=cur.slice();
(function anim(){cur=cur.map((v,i)=>v+(target[i]-v)*.18);poly.setAttribute('points',cur.map((v,i)=>pt(i,RR*v).join(',')).join(' '));requestAnimationFrame(anim)})();

function update(){
  const v=inputs.map(x=>{const n=x.value/10;x.nextElementSibling.textContent=n.toFixed(1);x.style.setProperty('--p',(n*100)+'%');return n});
  target=v;
  const S=v.reduce((a,b)=>a+b,0)/5,mode=S>=.75?'ai':S>=.5?'co':'hu',d=Math.min(Math.abs(S-.5),Math.abs(S-.75));
  const fired=gates.map((g,i)=>g==='yes'?i:-1).filter(i=>i>=0),unk=gates.includes('u');
  const GN=[L.T('현장 물리 작업','hands-on work on site'),L.T('AI가 못 쓰는 도구','a tool AI cannot reach'),L.T('최종 안전·법적 판단','a final safety or legal decision')];
  const MN={ai:L.T('AI가 수행','AI does it'),co:L.T('사람과 AI 협업','Together'),hu:L.T('사람이 수행','A person does it')};
  const COL={ai:'#7fa3c7',co:'#c9a96e',hu:'#b77a6f'};
  let verdict,why,col;
  if(fired.length){verdict=MN.hu;col=COL.hu;why=L.T('관문 작동: ','Gate fired: ')+fired.map(i=>GN[i]).join(', ')+L.T('. 관문은 어떤 점수보다 앞섭니다.','. Gates override any score.')}
  else if(unk){verdict=L.T('보류 — 사람이 결정','Pending — a person decides');col='#94a3b8';why=L.T('관문 질문에 답이 없어 관문을 풀지 않습니다. 점수 제안: ','A gate is unanswered, so it is not released. Score suggests: ')+MN[mode]+'.'}
  else{verdict=MN[mode];col=COL[mode];why=mode==='ai'?L.T('평균 역량이 0.75 이상입니다. 결과 승인은 여전히 사람이 합니다.','Average capability is 0.75 or higher. A person still accepts the result.'):mode==='co'?L.T('AI가 초안을 만들고, 사람이 확인하고 결정합니다.','AI drafts; a person checks and decides.'):L.T('데이터·방법·암묵지에 걸리는 부분이 너무 큽니다.','Too much depends on missing data, methods or tacit skill.')}
  const vEl=document.getElementById('verdict');vEl.textContent=verdict;vEl.style.color=col;
  document.getElementById('why').textContent=why;
  document.getElementById('marker').style.left=(S*100)+'%';
  document.getElementById('meta').innerHTML='S = <b>'+S.toFixed(2)+'</b><br>d = '+d.toFixed(2)+L.T(' (가까운 임계값까지)',' (to nearest threshold)')+'<br>'+L.T('점수 제안: ','score suggests: ')+MN[mode]+'<br><span class="flag'+(d<.05&&!fired.length?' on':'')+'">'+L.T('임계값 근처 · 사람 검토','near threshold · human review')+'</span>';
}
L.onLang.push(()=>{drawPresets();update()});
})();
</script>
</body>
</html>
